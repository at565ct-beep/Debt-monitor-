<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10233f"><title>Debt Monitor V2</title><link rel="manifest" href="manifest.json">
<style>
:root{--navy:#10233f;--blue:#2457d6;--bg:#f3f6fb;--card:#fff;--text:#172238;--muted:#68758b;--green:#13865b;--red:#c83d4d;--line:#e3e9f2;--amber:#946200}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:linear-gradient(135deg,#10233f,#2457d6);color:white;padding:22px 17px 27px;border-radius:0 0 23px 23px}header .top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:23px;margin:0}header p{margin:6px 0 0;color:#dbe6ff;font-size:13px}main{max-width:950px;margin:auto;padding:14px 13px 70px}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric,.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 3px 14px #17223808}.metric small{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:20px;margin-top:6px;overflow-wrap:anywhere}.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}nav{display:flex;gap:7px;overflow:auto;margin:16px 0 13px;padding-bottom:2px}nav button{white-space:nowrap;border:1px solid var(--line);background:white;padding:9px 12px;border-radius:99px;color:var(--muted);font-weight:650}nav button.active{background:var(--navy);color:white;border-color:var(--navy)}h2{font-size:18px;margin:4px 0 12px}h3{font-size:16px;margin:0 0 5px}.section-head,.item-head{display:flex;align-items:center;justify-content:space-between;gap:9px}.item-head{align-items:flex-start}.primary,.secondary,.dangerbtn{cursor:pointer;font:inherit;border-radius:10px;padding:9px 12px;font-weight:650}.primary{background:var(--blue);color:white;border:0}.secondary{background:white;border:1px solid var(--line);color:var(--text)}.dangerbtn{background:#fff;border:1px solid #efc5ca;color:var(--red)}.muted{color:var(--muted);font-size:12px}.amount{font-weight:750;font-size:18px;white-space:nowrap}.pills,.actions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.pill{background:#eef3ff;color:#284da3;border-radius:99px;padding:5px 8px;font-size:11px}.pill.red{background:#fff0f1;color:var(--red)}.pill.green{background:#e9f8f0;color:var(--green)}.list{display:grid;gap:10px}.actions button{font-size:12px;padding:7px 9px}label{font-size:12px;color:var(--muted);display:grid;gap:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8e0ec;border-radius:9px;background:white;color:var(--text);font:inherit}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}form{display:grid;gap:11px}.notice{background:#fff8e7;border:1px solid #f4dfaa;color:#76551a;border-radius:12px;padding:11px;font-size:12px;line-height:1.5;margin:12px 0}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #cbd5e4;border-radius:13px}.hidden{display:none!important}.progress{height:7px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--blue)}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.calendar-day{border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:7px;background:#fff}.calendar-day.overdue{border-color:#efb5bc;background:#fff8f8}.calendar-day.soon{border-color:#f0d18a;background:#fffdf5}footer{text-align:center;color:var(--muted);font-size:11px;padding:18px}@media(min-width:680px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}.list.twocol{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding-left:22px;padding-right:22px}}
</style></head><body>
<header><div class="top"><div><h1>Debt Monitor <span style="font-size:12px;opacity:.8">V2</span></h1><p>EMIs · Credit cards · Budget · Debt-free planning</p></div><div style="font-size:28px">₹</div></div></header>
<main><div id="lockScreen" class="panel hidden"></div><div id="app">
<div id="summary" class="summary"></div>
<nav id="tabs"><button class="active" data-tab="overview">Overview</button><button data-tab="calendar">EMI calendar</button><button data-tab="loans">Loans & interest</button><button data-tab="cards">Credit cards</button><button data-tab="planner">Debt planner</button><button data-tab="budget">Monthly budget</button><button data-tab="settings">Security & backup</button></nav>
<section id="overview"></section><section id="calendar" class="hidden"></section><section id="loans" class="hidden"></section><section id="cards" class="hidden"></section><section id="planner" class="hidden"></section><section id="budget" class="hidden"></section><section id="settings" class="hidden"></section>
</div><footer>Offline-first local tracker · Not connected to banks · Verify all lender figures</footer></main>
<script>
const KEY='debt-monitor-v2', OLD='debt-monitor-v1';
const seed={loans:[
{id:crypto.randomUUID(),name:'HDFC Insta / Tata Neu loan',kind:'Personal loan',principal:50000,balance:48114,rate:11.88,emi:2351,due:1,remaining:14,note:'Previously recorded; verify current balance and remaining EMIs.'},
{id:crypto.randomUUID(),name:'HDFC loan',kind:'Personal loan',principal:106000,balance:106000,rate:18,emi:3832,due:7,remaining:28,note:'Balance was not recently confirmed.'},
{id:crypto.randomUUID(),name:'IndusInd loan',kind:'Personal loan',principal:53000,balance:45041,rate:16.75,emi:4828,due:4,remaining:11,note:'Previously recorded; verify against latest statement.'}
],cards:[
{id:crypto.randomUUID(),name:'HDFC MoneyBack+',balance:33608,billed:33608,unbilled:0,minDue:0,due:10,rate:36,note:'Previously recorded total card liability; verify current statement.'},
{id:crypto.randomUUID(),name:'SBI SimplyCLICK',balance:4536,billed:4536,unbilled:0,minDue:0,due:0,rate:36,note:'Previously recorded; verify current bill and due date.'},
{id:crypto.randomUUID(),name:'YES Bank',balance:2010,billed:2010,unbilled:0,minDue:0,due:0,rate:36,note:'Previously recorded; verify current bill and due date.'}
],payments:[],budget:{salary:44615,housing:0,food:0,travel:0,utilities:0,other:0,extra:0},security:{pinHash:'',enabled:false},settings:{reminders:false}};
function uuid(){return crypto.randomUUID()}function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d)return d;let old=JSON.parse(localStorage.getItem(OLD));if(old){old.cards=old.cards.map(c=>({...c,billed:c.billed??c.balance,unbilled:c.unbilled??0,minDue:c.minDue??0,rate:c.rate??36}));old.budget=seed.budget;old.security=seed.security;old.settings=seed.settings;return old}}catch(e){}return JSON.parse(JSON.stringify(seed))}
let db=load(), unlocked=!db.security?.enabled;
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function n(v){return Math.max(0,Number(v)||0)}function money(v){return '₹'+Math.round(n(v)).toLocaleString('en-IN')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(a,f){return a.reduce((s,x)=>s+n(x[f]),0)}function loanDebt(){return sum(db.loans,'balance')}function cardDebt(){return sum(db.cards,'balance')}function emiSum(){return sum(db.loans,'emi')}function budgetExpenses(){let b=db.budget;return ['housing','food','travel','utilities','other'].reduce((s,k)=>s+n(b[k]),0)+emiSum()+sum(db.cards,'minDue')}
function monthDate(day,offset=0){let now=new Date(), y=now.getFullYear(),m=now.getMonth()+offset;let last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(Math.max(1,Number(day)||1),last))}
function dateStr(d){return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function daysUntil(d){let a=new Date();a.setHours(0,0,0,0);return Math.round((d-a)/86400000)}
function dueEvents(){let out=[];for(let x of db.loans){if(x.due){let d=monthDate(x.due);if(daysUntil(d)<0)d=monthDate(x.due,1);out.push({date:d,name:x.name,type:'EMI',amount:x.emi,id:x.id,group:'loans'})}}for(let x of db.cards){if(x.due){let d=monthDate(x.due);if(daysUntil(d)<0)d=monthDate(x.due,1);out.push({date:d,name:x.name,type:'Card payment',amount:x.minDue||x.billed,id:x.id,group:'cards'})}}return out.sort((a,b)=>a.date-b.date)}
function loanCard(x){let calc=calcLoan(x.balance,x.rate,x.emi);return `<article class="item"><div class="item-head"><div><h3>${esc(x.name)}</h3><div class="muted">${esc(x.kind||'Loan')}</div></div><div class="amount">${money(x.balance)}</div></div><div class="pills"><span class="pill">${n(x.rate)}% p.a.</span><span class="pill">${money(x.emi)} EMI</span><span class="pill">Due day ${x.due||'—'}</span><span class="pill">${x.remaining||'—'} EMIs left (entered)</span></div><div class="muted">Principal ${money(x.principal)} · Estimated payoff ${calc.months===null?'—':calc.months+' months'} · Future interest approx. ${calc.interest===null?'—':money(calc.interest)}</div>${x.note?`<div class="muted" style="margin-top:6px">${esc(x.note)}</div>`:''}<div class="actions"><button class="secondary" onclick="editLoan('${x.id}')">Edit</button><button class="secondary" onclick="payLoan('${x.id}')">Record EMI paid</button><button class="dangerbtn" onclick="removeItem('loans','${x.id}')">Delete</button></div></article>`}
function cardCard(x){return `<article class="item"><div class="item-head"><div><h3>${esc(x.name)}</h3><div class="muted">Credit card · assumed APR ${n(x.rate)}%</div></div><div class="amount">${money(x.balance)}</div></div><div class="pills"><span class="pill">Billed ${money(x.billed)}</span><span class="pill">Unbilled ${money(x.unbilled)}</span><span class="pill red">Minimum due ${money(x.minDue)}</span><span class="pill">Due day ${x.due||'Not set'}</span></div>${x.note?`<div class="muted">${esc(x.note)}</div>`:''}<div class="actions"><button class="secondary" onclick="editCard('${x.id}')">Edit statement</button><button class="secondary" onclick="payCard('${x.id}')">Record payment</button><button class="dangerbtn" onclick="removeItem('cards','${x.id}')">Delete</button></div></article>`}
function panel(t,b){return `<div class="panel"><h2>${t}</h2>${b}</div>`}
function render(){if(!unlocked){showLock();return}document.getElementById('lockScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
let upcoming=dueEvents().filter(e=>daysUntil(e.date)<=30);document.getElementById('summary').innerHTML=[['Total debt',money(loanDebt()+cardDebt()),'Loans + card balances'],['Loan outstanding',money(loanDebt()),db.loans.length+' loans'],['Credit cards',money(cardDebt()),db.cards.length+' cards'],['Monthly EMIs',money(emiSum()),'Excludes extra repayments']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><div class="sub">${x[2]}</div></div>`).join('');
document.getElementById('overview').innerHTML=`<div class="notice"><b>Verify starter data:</b> prefilled figures come from earlier details and may be stale. Update balances, rates, due dates and card statements from current lender records. Browser notifications require permission and may not fire reliably when the app is closed.</div><div class="section-head"><h2>Next 30 days</h2><button class="secondary" onclick="showTab('calendar')">View calendar</button></div>${upcoming.slice(0,4).map(eventHTML).join('')||'<div class="empty">No dated payments. Add due days to your accounts.</div>'}<div style="height:14px"></div>${panel('Debt snapshot',`<div class="list">${db.loans.map(loanCard).join('')||'<div class="empty">No loans added.</div>'}</div>`)}<div style="height:12px"></div>${panel('Card snapshot',`<div class="list">${db.cards.map(cardCard).join('')||'<div class="empty">No cards added.</div>'}</div>`)}`;
document.getElementById('calendar').innerHTML=`<div class="section-head"><h2>Upcoming payments</h2><button class="primary" onclick="requestNotifications()">Enable notifications</button></div><div class="notice">Dates are estimated from each account's due day and your phone's current date. This app does not have a background scheduler; browser reminders work only when supported by the browser and may require the app to be open.</div>${dueEvents().map(eventHTML).join('')||'<div class="empty">Add due dates to view the calendar.</div>'}`;
document.getElementById('loans').innerHTML=`<div class="section-head"><h2>Loans & interest calculator</h2><button class="primary" onclick="editLoan(null)">+ Add loan</button></div><div class="notice">Interest and payoff are estimates assuming a constant annual rate, monthly compounding, fixed EMI and no fees. Actual lender schedules can differ.</div><div class="list twocol">${db.loans.map(loanCard).join('')||'<div class="empty">No loans added.</div>'}</div>`;
document.getElementById('cards').innerHTML=`<div class="section-head"><h2>Credit-card statements</h2><button class="primary" onclick="editCard(null)">+ Add card</button></div><div class="notice">Keep billed and unbilled figures consistent with your statement. Total outstanding should equal billed + unbilled unless your bank reports additional adjustments.</div><div class="list twocol">${db.cards.map(cardCard).join('')||'<div class="empty">No cards added.</div>'}</div>`;
renderPlanner();renderBudget();renderSettings()}
function eventHTML(e){let d=daysUntil(e.date),cl=d<0?'overdue':d<=3?'soon':'';return `<div class="calendar-day ${cl}"><div class="item-head"><div><b>${esc(e.name)}</b><div class="muted">${e.type} · ${dateStr(e.date)}</div></div><div style="text-align:right"><b>${money(e.amount)}</b><div class="muted">${d<0?'Overdue':d===0?'Due today':'In '+d+' days'}</div></div></div></div>`}
function calcLoan(balance,rate,emi){balance=n(balance);rate=n(rate);emi=n(emi);if(balance===0)return {months:0,interest:0};let r=rate/1200;if(emi<=balance*r||emi===0)return {months:null,interest:null};let b=balance,interest=0,m=0;while(b>0.01&&m<1200){let i=b*r;interest+=i;b=Math.max(0,b+i-emi);m++}return {months:m,interest}}
function showTab(id){document.querySelectorAll('#app>section').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)});
function formDialog(title,fields,submit,callback){let old=document.getElementById('editor');if(old)old.remove();let d=document.createElement('div');d.id='editor';d.innerHTML=`<div class="panel" style="margin:10px 0"><div class="section-head"><h2>${title}</h2><button type="button" class="secondary" onclick="document.getElementById('editor').remove()">Close</button></div><form><div class="formgrid">${fields.map(f=>`<label class="${f.full?'full':''}">${f.label}<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.required?'required':''} ${f.step?'step="'+f.step+'"':''} placeholder="${f.placeholder||''}"></label>`).join('')}</div><button class="primary" type="submit">${submit}</button></form></div>`;document.getElementById(document.querySelector('#app>section:not(.hidden)').id).prepend(d);d.querySelector('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)));d.remove();save()};d.scrollIntoView({behavior:'smooth'})}
function editLoan(id){let x=db.loans.find(a=>a.id===id)||{name:'',kind:'Personal loan',principal:'',balance:'',rate:'',emi:'',due:'',remaining:'',note:''};formDialog(id?'Edit loan':'Add loan',[{name:'name',label:'Lender / loan name',value:x.name,required:true},{name:'kind',label:'Loan type',value:x.kind},{name:'principal',label:'Original amount (₹)',type:'number',value:x.principal,required:true},{name:'balance',label:'Current outstanding (₹)',type:'number',value:x.balance,required:true},{name:'rate',label:'Interest rate (% p.a.)',type:'number',step:'0.01',value:x.rate},{name:'emi',label:'Monthly EMI (₹)',type:'number',value:x.emi},{name:'due',label:'Due day (1–31)',type:'number',value:x.due},{name:'remaining',label:'EMIs remaining',type:'number',value:x.remaining},{name:'note',label:'Notes',value:x.note,full:true}], 'Save loan',d=>{let o={...x,...d,principal:n(d.principal),balance:n(d.balance),rate:n(d.rate),emi:n(d.emi),due:n(d.due),remaining:n(d.remaining)};if(id)Object.assign(x,o);else db.loans.push({...o,id:crypto.randomUUID()})})}
function editCard(id){let x=db.cards.find(a=>a.id===id)||{name:'',balance:'',billed:'',unbilled:'',minDue:'',due:'',rate:36,note:''};formDialog(id?'Edit statement':'Add credit card',[{name:'name',label:'Bank / card name',value:x.name,required:true},{name:'balance',label:'Total outstanding (₹)',type:'number',value:x.balance,required:true},{name:'billed',label:'Billed amount (₹)',type:'number',value:x.billed},{name:'unbilled',label:'Unbilled amount (₹)',type:'number',value:x.unbilled},{name:'minDue',label:'Minimum due (₹)',type:'number',value:x.minDue},{name:'due',label:'Payment due day (1–31)',type:'number',value:x.due},{name:'rate',label:'Interest APR (%; check card terms)',type:'number',step:'0.01',value:x.rate},{name:'note',label:'Notes',value:x.note,full:true}], 'Save card',d=>{let o={...x,...d,balance:n(d.balance),billed:n(d.billed),unbilled:n(d.unbilled),minDue:n(d.minDue),due:n(d.due),rate:n(d.rate)};if(id)Object.assign(x,o);else db.cards.push({...o,id:uuid()})})}
function removeItem(type,idv){let x=db[type].find(a=>a.id===idv);if(confirm('Delete '+x.name+'?')){db[type]=db[type].filter(a=>a.id!==idv);save()}}
function record(type,idv){let x=db[type].find(a=>a.id===idv),amount=prompt('Payment amount in ₹',type==='loans'?x.emi:(x.billed||x.balance));if(amount===null)return;amount=n(amount);if(!amount)return;x.balance=Math.max(0,n(x.balance)-amount);if(type==='cards'){x.billed=Math.max(0,n(x.billed)-amount)}if(type==='loans'&&x.remaining>0)x.remaining=Math.max(0,x.remaining-1);db.payments.push({date:new Date().toISOString().slice(0,10),name:x.name,type:type==='loans'?'Loan EMI':'Credit card payment',amount});save()}
function payLoan(idv){record('loans',idv)}function payCard(idv){record('cards',idv)}
function renderPlanner(){document.getElementById('planner').innerHTML=`<div class="panel"><h2>Debt-free planner</h2><p class="muted">Compare a snowball strategy (smallest balance first) with avalanche (highest interest first). Enter how much extra you can pay every month beyond required EMIs.</p><form id="plannerForm"><label>Extra monthly repayment budget (₹)<input type="number" name="extra" min="0" value="${n(db.budget.extra)}"></label><button class="primary">Compare strategies</button></form><div id="plannerResults"></div></div>`;document.getElementById('plannerForm').onsubmit=e=>{e.preventDefault();db.budget.extra=n(new FormData(e.target).get('extra'));save();calcPlans()};calcPlans()}
function simulate(order,extra){let accounts=db.loans.map(x=>({name:x.name,b:n(x.balance),r:n(x.rate)/1200,emi:n(x.emi)})),month=0,totalInterest=0;if(accounts.some(a=>a.b>0&&a.emi<=a.b*a.r)){}while(accounts.some(a=>a.b>0.01)&&month<1200){month++;for(let a of accounts){if(a.b>0){let interest=a.b*a.r;totalInterest+=interest;a.b+=interest;let payment=Math.min(a.b,a.emi);a.b-=payment}}let pool=extra;for(let a of order(accounts.filter(a=>a.b>0.01))){let p=Math.min(pool,a.b);a.b-=p;pool-=p;if(pool<=0)break}}return {months:month,interest:totalInterest,ok:month<1200}}
function calcPlans(){let extra=n(db.budget.extra),snow=simulate(db.loans.slice().sort((a,b)=>n(a.balance)-n(b.balance)),extra),aval=simulate(db.loans.slice().sort((a,b)=>n(b.rate)-n(a.rate)),extra);let el=document.getElementById('plannerResults');if(!el)return;el.innerHTML=`<div class="list" style="margin-top:14px"><div class="item"><h3>Snowball · smallest balance first</h3><div class="amount">${snow.ok?snow.months+' months':'Not paid off in 100 years'}</div><div class="muted">Estimated future interest: ${money(snow.interest)}</div></div><div class="item"><h3>Avalanche · highest interest first</h3><div class="amount">${aval.ok?aval.months+' months':'Not paid off in 100 years'}</div><div class="muted">Estimated future interest: ${money(aval.interest)}</div></div></div><p class="muted">Illustrative estimate only. Assumes fixed rates and EMIs, no fees, and applies extra money after scheduled EMIs. Results are approximate; verify lender amortisation schedules.</p>`}
function renderBudget(){let b=db.budget;document.getElementById('budget').innerHTML=`<div class="panel"><h2>Monthly budget</h2><p class="muted">Enter your take-home salary and monthly expenses. EMI obligations are included automatically.</p><form id="budgetForm"><div class="formgrid">${[['salary','Monthly take-home salary'],['housing','Rent / housing'],['food','Food & groceries'],['travel','Transport'],['utilities','Utilities & bills'],['other','Other expenses'],['extra','Extra debt repayment budget']].map(([k,l])=>`<label>${l} (₹)<input type="number" min="0" name="${k}" value="${n(b[k])}"></label>`).join('')}</div><button class="primary">Save budget</button></form><div id="budgetResult"></div></div>`;document.getElementById('budgetForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));for(let k in d)b[k]=n(d[k]);save()};let left=n(b.salary)-budgetExpenses();document.getElementById('budgetResult').innerHTML=`<div class="summary" style="margin-top:14px"><div class="metric"><small>Take-home salary</small><strong>${money(b.salary)}</strong></div><div class="metric"><small>Living expenses</small><strong>${money(['housing','food','travel','utilities','other'].reduce((s,k)=>s+n(b[k]),0))}</strong></div><div class="metric"><small>Loan EMIs</small><strong>${money(emiSum())}</strong></div><div class="metric"><small>Estimated cash left</small><strong style="color:${left<0?'var(--red)':'var(--green)'}">${money(left)}</strong></div></div><div class="notice">Available cash is salary minus the expenses, loan EMIs and card minimum dues entered here. Card purchases and savings are not automatically imported.</div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="panel"><h2>PIN protection</h2><p class="muted">Set a local app PIN. This is a basic access barrier, not bank-grade encryption; browser storage can be accessed by someone with device/browser access.</p><form id="pinForm"><label>New 4–8 digit PIN<input name="pin" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" placeholder="${db.security.enabled?'Enter a new PIN to change':'Set PIN (4–8 digits)'}" required></label><label>Confirm PIN<input name="confirm" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label><div class="actions"><button class="primary">Save PIN</button>${db.security.enabled?'<button class="dangerbtn" type="button" onclick="disablePin()">Disable PIN</button>':''}</div></form><p id="pinStatus" class="muted">${db.security.enabled?'PIN lock enabled. Lock activates on next app load.':'PIN lock is currently disabled.'}</p></div><div class="panel" style="margin-top:12px"><h2>Backup & reminders</h2><div class="actions"><button class="primary" onclick="backup()">Download JSON backup</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restore backup</button><button class="secondary" onclick="exportCSV()">Export payments CSV</button></div><label style="margin-top:12px"><span><input type="checkbox" id="reminders" style="width:auto" ${db.settings.reminders?'checked':''}> Enable browser reminders when supported</span></label><p class="muted">Browser reminders are best-effort and do not run as guaranteed background alarms. Use your phone's Clock/Calendar for reliable reminders.</p><button class="secondary" onclick="saveReminder()">Save reminder preference</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restore(event)"></div><div class="notice">Never store card numbers, CVV, PINs for bank cards, OTPs or banking passwords in this app.</div>`;document.getElementById('pinForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.pin!==d.confirm){alert('PINs do not match.');return}db.security.pinHash=await hash(d.pin);db.security.enabled=true;unlocked=true;save();alert('App PIN set. It will be requested on the next app load.')}}
async function hash(s){let data=new TextEncoder().encode(s);let digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function showLock(){document.getElementById('app').classList.add('hidden');let el=document.getElementById('lockScreen');el.classList.remove('hidden');el.innerHTML=`<h2>Debt Monitor locked</h2><p class="muted">Enter your app PIN to view your records.</p><form id="unlockForm"><label>PIN<input name="pin" inputmode="numeric" type="password" pattern="[0-9]{4,8}" required autofocus></label><button class="primary">Unlock</button><div id="lockError" class="muted"></div></form>`;document.getElementById('unlockForm').onsubmit=async e=>{e.preventDefault();let p=new FormData(e.target).get('pin');if(await hash(p)===db.security.pinHash){unlocked=true;render()}else document.getElementById('lockError').textContent='Incorrect PIN. Try again.'}}
function disablePin(){if(!confirm('Disable app PIN protection?'))return;db.security={enabled:false,pinHash:''};unlocked=true;save()}
function saveReminder(){db.settings.reminders=document.getElementById('reminders').checked;if(db.settings.reminders)requestNotifications();save()}
async function requestNotifications(){if(!('Notification'in window)){alert('This browser does not support notifications.');return}let p=await Notification.requestPermission();if(p==='granted'){let events=dueEvents().filter(e=>daysUntil(e.date)>=0&&daysUntil(e.date)<=3);if(events.length){events.forEach(e=>new Notification('Upcoming payment: '+e.name,{body:money(e.amount)+' · '+dateStr(e.date)}))}else new Notification('Debt Monitor',{body:'Notifications enabled. No payments due in the next 3 days.'})}else alert('Notification permission was not granted.')}
function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'debt-monitor-v2-backup.json')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.loans)||!Array.isArray(x.cards))throw 0;if(confirm('Replace current data with this backup?')){db=x;db.security??={enabled:false,pinHash:''};db.settings??={reminders:false};unlocked=!db.security.enabled;save()}}catch(err){alert('Invalid backup file.')} };r.readAsText(f)}
function exportCSV(){let rows=[['Date','Account','Type','Amount'],...db.payments.map(p=>[p.date,p.name,p.type,p.amount])],csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv'}),'debt-payments.csv')}
render();if(!unlocked)showLock();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
